<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lison - Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--paper:#cfcbbd;--rasp:#8E1049;--sp:134px;--flip:1100ms}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}
#nb{position:fixed;inset:0;perspective:3200px;perspective-origin:0% 50%;overflow:hidden}
.page{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform var(--flip) cubic-bezier(.55,.05,.25,1)}
.page.turned{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper) var(--pimg,none) center/cover}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(0,0,0,.28),rgba(0,0,0,0) 60%);transition:opacity var(--flip)}
.page.flipping .face::after{opacity:1}
.spirals{position:absolute;top:0;bottom:0;left:0;width:var(--sp);z-index:100;pointer-events:none;background:var(--simg,none) 0 0/var(--sp) auto repeat-y}
#intro{position:absolute;inset:0;padding-left:var(--sp);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.l{font-family:"La Belle Aurore",cursive;color:var(--rasp);font-size:clamp(34px,6.2vw,92px);line-height:1.4;white-space:nowrap;padding:0 .3em;clip-path:inset(-30% 100% -30% 0)}
.l.go{animation:write var(--d) cubic-bezier(.45,.05,.55,.95) var(--s) forwards}
.l:nth-of-type(1){--d:1.8s;--s:.3s}.l:nth-of-type(2){--d:2.6s;--s:2.3s}.l:nth-of-type(3){--d:2.1s;--s:5.1s}
@keyframes write{to{clip-path:inset(-30% -5% -30% 0)}}
#clip{position:absolute;top:0;bottom:0;left:var(--sp);right:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1068px;transform-origin:0 0}
#vid{position:absolute;left:0;top:0;width:1920px;height:1068px;display:block}
#hat{position:absolute;left:940px;top:172px;width:190px;cursor:pointer;opacity:0;transform:translateY(-300px) rotate(-20deg);-webkit-user-drag:none;user-select:none}
#hat.show{animation:drop .8s cubic-bezier(.3,1.5,.5,1) forwards}
#hat.idle{opacity:1;transform:none;animation:bob 1.6s ease-in-out infinite}
@keyframes drop{0%{opacity:0;transform:translateY(-300px) rotate(-20deg)}100%{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-8px)}}
#hint{position:absolute;left:1105px;top:237px;width:46px;opacity:0;pointer-events:none;transition:opacity .4s}
#hint.show{opacity:1;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{50%{transform:translate(-8px,-8px)}}
.w{position:absolute;font-family:"Caveat",cursive;font-weight:600;font-size:64px;color:#2b2b3a;cursor:pointer;opacity:0;transform:scale(.3);transition:opacity .4s,transform .4s cubic-bezier(.3,1.6,.5,1);padding:4px 10px;white-space:nowrap}
.w.show{opacity:1;transform:rotate(var(--r,0deg))}
.w:hover{color:var(--rasp)}
.note{position:absolute;z-index:20;width:430px;min-height:300px;background:#ece5cf;box-shadow:3px 8px 18px rgba(0,0,0,.28);padding:28px 30px;font-family:"Caveat",cursive;font-size:48px;color:#2b2b3a;opacity:0;pointer-events:none;transform:scale(.85) rotate(-2deg);transition:.25s}
.note.show{opacity:1;pointer-events:auto;transform:rotate(-2deg)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:200;border:0;background:none;font-size:56px;line-height:1;color:#222;opacity:.55;cursor:pointer;padding:10px 14px}
.arrow:hover{opacity:1}.arrow.prev{left:calc(var(--sp) + 4px)}.arrow.next{right:6px}.arrow[hidden]{display:none}
@media(max-width:700px){.l{font-size:8.4vw}.arrow{font-size:40px}}
</style>
</head>
<body>
<main id="nb">
<section class="page"><div class="face front"><div id="intro">
<div class="l">Dear Recruiter,</div><div class="l">I'm Lison, and I want</div><div class="l">to work with you.</div></div></div><div class="face back"></div></section>
<section class="page"><div class="face front"><div id="clip"><div id="stage">
<video id="vid" muted playsinline preload="auto" src="marche_papier_page2_v2.mp4"></video>
<img id="hat" alt="Chapeau de diplômée" draggable="false">
<svg id="hint" viewBox="0 0 24 24"><path d="M5 2l14 10-6 1.5 3.5 7-3 1.5-3.5-7L5 19z" fill="#fff" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div class="w" style="left:520px;top:300px;--r:-4deg" data-n="Collège">collège</div>
<div class="w" style="left:600px;top:450px;--r:3deg" data-n="Lycée">lycée</div>
<div class="w" style="left:540px;top:600px;--r:-3deg" data-n="Licence">licence</div>
<div class="w" style="left:1250px;top:360px;--r:3deg" data-n="Master">master</div>
<div class="w" style="left:1230px;top:540px;--r:-3deg" data-n="Certifications">certifications</div>
<div class="note" id="note"></div>
</div></div></div><div class="face back"></div></section>
<section class="page"><div class="face front"></div><div class="face back"></div></section>
<section class="page"><div class="face front"></div><div class="face back"></div></section>
<section class="page"><div class="face front"></div><div class="face back"></div></section>
<section class="page"><div class="face front"></div><div class="face back"></div></section>
<div class="spirals"></div>
<button class="arrow prev" id="prev" hidden>&#8249;</button><button class="arrow next" id="next">&#8250;</button>
</main>
<script>
(function(){var b=document.createElement('video');b.muted=true;b.preload='auto';b.src='marche_papier_page2_v2.mp4';
b.addEventListener('loadedmetadata',function(){b.currentTime=Math.max(0,b.duration-.1)});
b.addEventListener('seeked',function(){try{var f=b.videoWidth/1920,c=document.createElement('canvas'),x=c.getContext('2d');
c.width=730;c.height=1068;x.drawImage(b,170*f,0,730*f,1068*f,0,0,730,1068);var p=c.toDataURL('image/jpeg',.8);
var d=document.createElement('canvas');d.width=170;d.height=1039;d.getContext('2d').drawImage(b,0,20*f,170*f,1039*f,0,0,170,1039);
document.documentElement.style.setProperty('--pimg','url('+p+')');document.documentElement.style.setProperty('--simg','url('+d.toDataURL('image/jpeg',.9)+')')}catch(e){}},{once:true})})();
(function(){var hi=new Image();hi.onload=function(){var w=hi.width-6,h=hi.height-6,c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(hi,3,3,w,h,0,0,w,h);
var im=x.getImageData(0,0,w,h),d=im.data;for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],bl=d[i+2],L=.299*r+.587*g+.114*bl,mx=Math.max(r,g,bl),mn=Math.min(r,g,bl),s=mx?(mx-mn)/mx*255:0;
var a=Math.max(Math.min(1,Math.max(0,(150-L)/45)),Math.min(1,Math.max(0,(s-60)/40)));d[i+3]=a*255}x.putImageData(im,0,0);document.getElementById('hat').src=c.toDataURL('image/png')};hi.src='Capture%20d%E2%80%99%C3%A9cran%202026-11-26%20%C3%A0%2008.22.47.png'})();
(function(){
var pages=[].slice.call(document.querySelectorAll('.page')),T=pages.length,cur=0,busy=false,FL=1100;
var root=document.documentElement,prev=document.getElementById('prev'),next=document.getElementById('next');
var stage=document.getElementById('stage'),vid=document.getElementById('vid'),hat=document.getElementById('hat'),hint=document.getElementById('hint');
var words=[].slice.call(document.querySelectorAll('.w')),note=document.getElementById('note');
function layout(){
  var W=innerWidth,H=innerHeight,sp=Math.min(170*H/1068,W*.16);root.style.setProperty('--sp',sp+'px');
  var cw=W-sp,s=Math.max(cw/1750,H/1068),gx=(1035-170)*s;
  var off=Math.max(cw-1750*s,Math.min(0,cw/2-gx));
  stage.style.transform='translate('+(off-170*s)+'px,'+((H-1068*s)/2)+'px) scale('+s+')';
}
layout();addEventListener('resize',layout);
function stack(){pages.forEach(function(p,i){p.style.zIndex=T-i})}stack();
var lines=[].slice.call(document.querySelectorAll('.l'));
function intro(){lines.forEach(function(e){e.classList.remove('go')});void document.body.offsetWidth;lines.forEach(function(e){e.classList.add('go')})}
var ht;
function showHat(){hat.classList.add('show');ht=setTimeout(function(){hat.classList.remove('show');hat.classList.add('idle');hint.classList.add('show')},850)}
function p2(){reset2();vid.currentTime=0;var p=vid.play();if(p&&p.catch)p.catch(function(){ht=setTimeout(showHat,800)});vid.onended=showHat;
  ht=setTimeout(function(){if(!hat.classList.contains('show')&&!hat.classList.contains('idle'))showHat()},12000)}
function reset2(){clearTimeout(ht);try{vid.pause()}catch(e){}hat.className='';hint.classList.remove('show');words.forEach(function(w){w.classList.remove('show')});note.classList.remove('show')}
hat.addEventListener('click',function(){hint.classList.remove('show');var on=!words[0].classList.contains('show');
  words.forEach(function(w,i){setTimeout(function(){w.classList[on?'add':'remove']('show')},on?i*140:0)});if(!on)note.classList.remove('show')});
words.forEach(function(w){w.addEventListener('click',function(e){e.stopPropagation();
  var wasOpen=note.classList.contains('show')&&note.dataset.k===w.dataset.n;
  if(wasOpen){note.classList.remove('show');return}
  note.dataset.k=w.dataset.n;note.textContent=w.dataset.n;
  var x=parseFloat(w.style.left),y=parseFloat(w.style.top);note.style.left=(x<960?x+120:x-330)+'px';note.style.top=(y+70)+'px';note.classList.add('show')})});
document.getElementById('clip').addEventListener('click',function(e){if(e.target===this||e.target===stage||e.target===vid)note.classList.remove('show')});
function enter(i){if(i===0)intro();if(i===1)p2()}
function leave(i){if(i===1)reset2()}
function ui(){prev.hidden=cur===0;next.hidden=cur===T-1}
function go(d){if(busy)return;var n=cur+d;if(n<0||n>=T)return;busy=true;leave(cur);
  var tp=d>0?pages[cur]:pages[n];tp.style.zIndex=T+10;tp.classList.add('flipping');tp.classList[d>0?'add':'remove']('turned');
  cur=n;ui();setTimeout(function(){tp.classList.remove('flipping');stack();enter(cur);busy=false},FL)}
next.onclick=function(){go(1)};prev.onclick=function(){go(-1)};
addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
var wl=false;addEventListener('wheel',function(e){e.preventDefault();if(wl||busy)return;var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<12)return;wl=true;go(d>0?1:-1);setTimeout(function(){wl=false},FL+350)},{passive:false});
var sx=0,sy=0;addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1)},{passive:true});
ui();var st=false;function start(){if(st)return;st=true;enter(0)}
if(document.fonts&&document.fonts.load){document.fonts.load('40px "La Belle Aurore"').then(start,start);setTimeout(start,2500)}else start();
})();
</script>
</body>
</html>
