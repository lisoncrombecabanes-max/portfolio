.env:hover .ec,.env.sent .ec{opacity:0}
.env:hover .eo,.env.sent .eo{opacity:1}

.pclip{position:absolute;inset:0;clip-path:polygon(-20% -200%,120% -200%,120% 45%,66.9% 66%,32.5% 66%,-20% 45%)}

2%{transform:rotate(-2.2deg) translateX(-3px)}4%{transform:rotate(2.2deg) translateX(3px)}6%{transform:rotate(-2.2deg) translateX(-3px)}8%{transform:rotate(2.2deg) translateX(3px)}10%{transform:rotate(-2deg) translateX(-3px)}12%{transform:rotate(2deg) translateX(3px)}
14%{transform:rotate(-1.8deg) translateX(-2px)}16%{transform:rotate(1.8deg) translateX(2px)}18%{transform:rotate(-1.8deg)}20%{transform:rotate(1.8deg)}22%{transform:rotate(-1.6deg)}24%{transform:rotate(1.6deg)}26%{transform:rotate(-1.4deg)}28%{transform:rotate(1.4deg)}30%{transform:rotate(-1deg)}32%{transform:rotate(1deg)}34%{transform:rotate(-.5deg)}36%{transform:rotate(.5deg)}}
